# Agent kit. Keep it independent from product repositories.
# These plain-text definitions can be reused by any AI host.
# Any orchestrator may load this file and create its own subagents.
# Odradek observes only the explicit local event stream.

runtime:
  defaultModel: host-selected
  # Product repository that agents modify (any local developer clone).
  # Override with --workspace or WORKSPACE_CWD.
  workspaceCwd: ${WORKSPACE_CWD:-.}
  maxDialogueRounds: 12

identityIntegrity:
  sourceOfTruth: Odradek agent-kit
  executionModes: [multi]
  # A role key selects a prompt; it is never an execution identity.
  requireRealHostAgentId: true
  requireProviderForEachInstance: true
  prohibitRoleNamesAsInstanceIds: true
  requireRegisteredInstancesForMultiAgent: true

dialogue:
  # Mandatory once-per-task planning assignment. The architect's initial plan
  # selects the minimum sufficient real agents for the whole scope; do not use
  # this legacy order to create one agent per delivery phase.
  # Declarative host guidance does not prove a real instance was created.
  openingOrder:
    - architect
  # Roles allowed to close an objective with status "done".
  closers:
    - reviewer
    - supervisor

agents:
  product-analyst:
    displayName: Product Analyst
    enabled: true
    model: host-selected
    promptFile: prompts/product-analyst.md
    skills: [acceptance-qa-and-recovery, metrics-and-evaluations]
    runtime: local
    responsibilities:
      - Turn work items into a clear goal and acceptance criteria
      - Detect ambiguity and ask before implementation
    mayRequestFrom:
      - architect
      - devops

  architect:
    displayName: Solution Architect
    enabled: true
    model: host-selected
    promptFile: prompts/architect.md
    skills: [orchestration-and-real-identity, parallel-worktrees-and-review]
    runtime: local
    responsibilities:
      - Route every task including questions, reviews, documentation, and tiny fixes
      - Define one end-to-end task plan and minimum sufficient real delegation
      - Cover implementation, validation/review, commit/integration, and deployment when applicable
      - Assign real specialists, ownership, dependencies, acceptance criteria, and reviewers
      - Require real UX and QA reviewers for user-facing changes
      - Answer architecture-only tasks directly and delegate other execution
      - Technical design, service boundaries, and API contracts
      - Align with the product platform without deploying agents there
    mayRequestFrom:
      - product-analyst
      - devops
      - engineer
      - reviewer
      - supervisor

  devops:
    displayName: DevOps / Platform
    enabled: true
    model: host-selected
    promptFile: prompts/devops.md
    skills: [safe-workspace-and-guardrails, odradek-observability]
    runtime: local
    responsibilities:
      - CI/CD, container images, and deployment manifests
      - Secrets, observability, and deployment policies
    mayRequestFrom:
      - architect
      - engineer

  engineer:
    displayName: Software Engineer
    enabled: true
    model: host-selected
    promptFile: prompts/engineer.md
    skills: [safe-workspace-and-guardrails, acceptance-qa-and-recovery, metrics-and-evaluations]
    runtime: local
    responsibilities:
      - Implementation and tests in the workspace
      - Code aligned with architectural decisions
    mayRequestFrom:
      - architect
      - product-analyst

  reviewer:
    displayName: Quality & Security Reviewer
    enabled: true
    model: host-selected
    promptFile: prompts/reviewer.md
    skills: [acceptance-qa-and-recovery, safe-workspace-and-guardrails, parallel-worktrees-and-review]
    runtime: local
    responsibilities:
      - Change review, security, tests, and merge readiness
      - May return work to engineer or devops
    mayRequestFrom:
      - engineer
      - devops
      - architect

  supervisor:
    displayName: Dialogue Supervisor
    enabled: true
    model: host-selected
    promptFile: prompts/supervisor.md
    skills: [orchestration-and-real-identity, odradek-observability, metrics-and-evaluations]
    runtime: local
    responsibilities:
      - Coordinate the architect-approved assignments and real host instances
      - Return new objectives and material scope changes to the architect
      - Detect blockers and loops; close or escalate when needed
    # Does not use code tools; reasons only over the message bus.

integrations:
  example:
    enabled: false
    mcpServerName: replace-with-your-server
    notes: Add only local or organization-approved integrations. Never commit credentials.
